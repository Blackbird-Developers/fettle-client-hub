# Every function runs with verify_jwt = false and checks its own caller
# (user JWT, admin role, service-role key, cron secret or webhook signature).
# Which check each one uses: docs/edge-function-auth.md.

[functions.acuity]
verify_jwt = false

[functions.session-reminders]
verify_jwt = false

[functions.get-payment-history]
verify_jwt = false

[functions.cancel-session-with-refund]
verify_jwt = false

[functions.send-booking-confirmation]
verify_jwt = false

[functions.create-payment-intent]
verify_jwt = false

[functions.confirm-payment-and-book]
verify_jwt = false

# Same reason as confirm-payment-and-book: the stripe-webhook backstop invokes
# this server-to-server with the service-role key and cannot present a user
# JWT; every other caller must send the buyer's JWT. The function binds
# the purchase to the buyer — it reads userId/email from the PaymentIntent
# metadata, which only our own create-package-payment-intent can write, and it
# can never fulfil a payment that did not actually succeed.
[functions.confirm-package-payment]
verify_jwt = false

# Stripe calls this server-to-server and cannot present a Supabase JWT;
# the function authenticates the request via the Stripe webhook signature instead.
[functions.stripe-webhook]
verify_jwt = false

[functions.sync-acuity-appointments]
verify_jwt = false

# The function reads the caller's JWT itself (to bind the review to the real
# user) and verifies appointment ownership against Acuity before writing.
[functions.submit-therapist-review]
verify_jwt = false

# Machine-invoked by the scheduled GitHub Actions workflow; authenticated by
# the x-cron-secret header (REMINDER_CRON_SECRET), not a user JWT.
[functions.unpaid-session-reminders]
verify_jwt = false

# Same as unpaid-session-reminders: invoked by the scheduled GitHub Actions
# workflow and authenticated by the x-cron-secret header.
[functions.portal-adoption-emails]
verify_jwt = false

# Two callers: the admin-snapshots workflow (x-cron-secret, no JWT) and
# admins, whose JWT and admin role the function checks itself.
[functions.admin-bundles]
verify_jwt = false

# Called only by the admin-snapshots workflow, authenticated by the
# x-cron-secret header.
[functions.acuity-appointments-mirror]
verify_jwt = false

# Resend calls this server-to-server; every request is checked against the
# Svix signature (RESEND_WEBHOOK_SECRET) instead of a JWT.
[functions.resend-webhook]
verify_jwt = false

# Opened from unsubscribe links by people who aren't logged in (and by inbox
# one-click unsubscribe); the signed token in the link is checked instead.
[functions.email-unsubscribe]
verify_jwt = false

[functions.export-user-data]
verify_jwt = false

[functions.delete-user-account]
verify_jwt = false

# Two callers: the sales-tasks workflow every morning (x-cron-secret, no JWT)
# and admins pressing "Prepare today's list", whose JWT and admin role the
# function checks itself.
[functions.sales-tasks]
verify_jwt = false

