# Rebuilds the saved copy of the admin Bundles page from Acuity, so the page
# opens at once instead of waiting on Acuity. The build is too long for one
# edge-function call, and Acuity's full certificate list times out, so the
# script calls admin-bundles one step at a time (emails from a year of
# appointments, certificates looked up per email, appointments, save) and the
# function saves the result to admin_snapshots. Only counts and timings reach
# these logs — never client data.
#
# The acuity-appointments job then updates the acuity_appointments copy that
# the admin Overview analytics read from (see sync-acuity-appointments.mjs).
name: Admin snapshots

on:
  schedule:
    - cron: "15 6-19 * * *" # hourly 06:15–19:15 UTC, every day
    # Overnight: the Acuity appointments copy only (the brief's nightly
    # refresh), which also gives the one-off history copy a quiet hour.
    - cron: "15 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: admin-snapshots
  cancel-in-progress: false

jobs:
  bundles:
    if: github.event.schedule != '15 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the Bundles snapshot
        env:
          FUNCTION_URL: https://gxeoillrmjezpehmcvrh.supabase.co/functions/v1/admin-bundles
          CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: node .github/scripts/build-bundles-snapshot.mjs

  # Keeps the acuity_appointments copy behind the admin Overview analytics up
  # to date (refresh window, then history and "who booked it" lookups a batch
  # at a time). Runs after the Bundles build so the two don't share Acuity's
  # rate limit, and runs even if that build failed.
  acuity-appointments:
    needs: bundles
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync the Acuity appointments copy
        env:
          FUNCTION_URL: https://gxeoillrmjezpehmcvrh.supabase.co/functions/v1/acuity-appointments-mirror
          CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: node .github/scripts/sync-acuity-appointments.mjs
