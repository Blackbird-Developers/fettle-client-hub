# Weekday trigger for the portal-adoption emails (Email 1 to existing clients
# without a hub account, Email 2 to new enquiries). The edge function does all
# the deciding — including dry-run mode until PORTAL_EMAILS_LIVE=true is set in
# Supabase — this workflow just rings the bell on weekday mornings.
#
# Run it by hand with a test address to get a "[TEST]" copy of one email at
# that address only (no client is emailed, nothing is recorded); leave the
# address blank for the normal run.
name: Portal adoption emails

on:
  schedule:
    - cron: "30 8 * * 1-5" # weekdays 08:30 UTC (09:30 Irish summer / 08:30 winter)
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a [TEST] copy to this address only (leave blank for the normal run)"
        required: false
        default: ""
      campaign:
        description: "Which email to test"
        type: choice
        options:
          - existing_clients
          - new_enquiries
        default: existing_clients

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke portal-adoption email function
        run: |
          set -euo pipefail
          # The repo is public, so its logs are too: read the test address
          # from the event file (never echoed) and mask it.
          test_email=$(jq -r '.inputs.test_email // ""' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')
          campaign=$(jq -r '.inputs.campaign // "existing_clients"' "$GITHUB_EVENT_PATH")
          if [ -n "$test_email" ]; then
            echo "::add-mask::$test_email"
            case "$test_email" in
              *@*.*) ;;
              *) echo "Test address doesn't look like an email address"; exit 1 ;;
            esac
            body=$(jq -nc --arg e "$test_email" --arg c "$campaign" '{testEmail: $e, campaign: $c}')
            echo "Sending a [TEST] copy of $campaign"
          else
            body='{}'
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.REMINDER_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$body" \
            "https://gxeoillrmjezpehmcvrh.supabase.co/functions/v1/portal-adoption-emails")
          status=$(echo "$response" | tail -1)
          echo "$response" | head -n -1
          test "$status" = "200"
